<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>憲政院</title>
<meta name="theme-color" content="#2A2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="憲政院">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--paper:#F4EFE4;--sheet:#FBF8F1;--ink:#2A2118;--sub:#6E6252;--rule:#D8CDB8;--gold:#A8842C;--red:#9E2A22;
  --rinen:#7A3B8F;--seido:#2F5D7A;--ok:#3D7A4A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;font-size:15.5px;line-height:1.75;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,input,select,textarea,.ui{font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem 2rem}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-bottom:.55rem;border-bottom:3px double var(--ink);margin-bottom:1rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:.25em}
.head .sub{color:var(--sub);font-size:.8rem;text-align:right;font-family:"BIZ UDPGothic",sans-serif}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:.85rem 1rem;margin:0 0 1rem}
.card h2{margin:0 0 .55rem;font-size:1.02rem;letter-spacing:.12em;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.card h2 small{font-weight:400;color:var(--sub);font-size:.76rem;letter-spacing:0;font-family:"BIZ UDPGothic",sans-serif}
.view[hidden]{display:none}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:.45rem 1.1rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:.2rem .7rem;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.note{font-size:.8rem;color:var(--sub);margin:.25rem 0;font-family:"BIZ UDPGothic",sans-serif;line-height:1.6}
.f{margin:.4rem 0}.f label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:.15rem;font-family:"BIZ UDPGothic",sans-serif}
.f input,.f select,.f textarea{width:100%;padding:.45rem .55rem;border:1px solid var(--rule);border-radius:4px;background:#fff}
.f textarea{line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.4rem .7rem}
.status{font-size:.84rem;color:var(--sub)}.status.err{color:var(--red)}
.linkbtn{border:none;background:none;color:var(--seido);cursor:pointer;padding:0;font-size:.84rem;text-decoration:underline}
.linkbtn.del{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:0 0 .7rem;flex-wrap:wrap}
.seg button{border:none;background:#fff;padding:.25rem .85rem;cursor:pointer;color:var(--sub);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* 条文 */
.kind{display:inline-block;font-size:.7rem;font-weight:700;border-radius:3px;padding:0 .4rem;color:#fff;font-family:"BIZ UDPGothic",sans-serif;vertical-align:.12em}
.kind.rinen{background:var(--rinen)}.kind.seido{background:var(--seido)}.kind.none{background:#999}
.root{display:inline-block;font-size:.7rem;border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:0 .35rem;font-family:"BIZ UDPGothic",sans-serif;vertical-align:.12em}
.tag{display:inline-block;font-size:.7rem;border:1px solid var(--rule);color:var(--sub);border-radius:3px;padding:0 .35rem;font-family:"BIZ UDPGothic",sans-serif;vertical-align:.12em}
.tag.warn{border-color:var(--red);color:var(--red)}
.chap{font-size:.95rem;font-weight:700;letter-spacing:.15em;margin:1.2rem 0 .3rem;padding-bottom:.2rem;border-bottom:1px solid var(--rule)}
.art{padding:.55rem 0 .6rem;border-bottom:1px dashed var(--rule);cursor:pointer}
.art:last-child{border-bottom:none}
.art-h{display:flex;gap:.4rem;align-items:baseline;flex-wrap:wrap}
.art-no{font-weight:700;letter-spacing:.05em}
.art-t{white-space:pre-wrap;word-break:break-word;margin:.15rem 0 0}
.art-basis{font-size:.78rem;color:var(--sub);font-family:"BIZ UDPGothic",sans-serif;margin-top:.15rem}
.art.susp .art-t{opacity:.5;text-decoration:line-through}
.detail{border:2px solid var(--ink);border-radius:6px;background:#fff;padding:.9rem 1rem;margin:0 0 1rem}
.detail h3{margin:0 0 .4rem;font-size:1.1rem;letter-spacing:.08em}
.detail .art-t{font-size:1.08rem}
.ladder{display:flex;gap:2px;margin:.4rem 0}
.ladder span{flex:1;text-align:center;font-size:.66rem;padding:.2rem 0;border-radius:2px;background:#EEE6D6;color:var(--sub);font-family:"BIZ UDPGothic",sans-serif;line-height:1.3}
.ladder span.on{background:var(--rinen);color:#fff}
.deep h4{margin:.8rem 0 .2rem;font-size:.86rem;letter-spacing:.08em}
.ev{font-size:.88rem;padding:.25rem 0;border-bottom:1px dotted var(--rule)}
.ev small{color:var(--sub);font-family:"BIZ UDPGothic",sans-serif;margin-right:.4rem}

/* 改正 */
.prop{border:1px solid var(--rule);border-left:5px solid var(--seido);border-radius:6px;background:#fff;padding:.65rem .8rem;margin:.5rem 0}
.prop.heavy{border-left-color:var(--rinen)}
.prop-h{display:flex;gap:.4rem;align-items:baseline;flex-wrap:wrap}
.prop-h b{flex:1;min-width:0}
.stage{display:flex;gap:2px;margin:.4rem 0}
.stage span{flex:1;text-align:center;font-size:.7rem;padding:.15rem 0;background:#EEE6D6;color:var(--sub);border-radius:2px;font-family:"BIZ UDPGothic",sans-serif}
.stage span.on{background:var(--ink);color:var(--paper)}.stage span.done{background:#C9BBA0;color:var(--ink)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.4rem 0}
.diff div{background:#F7F2E7;border-radius:4px;padding:.4rem .5rem;white-space:pre-wrap;word-break:break-word;font-size:.9rem}
.diff .old{border-left:3px solid #BBB}.diff .new{border-left:3px solid var(--gold)}
.diff small{display:block;font-size:.7rem;color:var(--sub);font-family:"BIZ UDPGothic",sans-serif}
.q{margin:.5rem 0}.q label{display:block;font-size:.84rem;margin-bottom:.15rem}
.lock{font-size:.82rem;color:var(--red);font-family:"BIZ UDPGothic",sans-serif;margin:.3rem 0}

/* 今日・審査 */
.today-art{font-size:1.12rem;white-space:pre-wrap;word-break:break-word;margin:.3rem 0 .5rem}
.ans{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.alert{border:1px solid var(--gold);background:#FBF3DE;border-radius:6px;padding:.5rem .75rem;margin:0 0 .8rem;font-size:.9rem}
.alert.red{border-color:var(--red);background:#F8E6E1}
.alert b{letter-spacing:.05em}
.item{padding:.45rem 0;border-bottom:1px dashed var(--rule);font-size:.92rem}
.item small{color:var(--sub);font-family:"BIZ UDPGothic",sans-serif}
.hist{font-size:.86rem;padding:.35rem 0;border-bottom:1px dotted var(--rule)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700;font-size:.86rem;white-space:nowrap;min-width:0}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);border-radius:6px;padding:.6rem .9rem;font-size:.9rem;z-index:40;max-width:calc(100% - 2rem);font-family:"BIZ UDPGothic",sans-serif}
.toast[hidden]{display:none}
.se-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.5rem 0;font-size:.86rem}.se-btn{min-width:2.6rem;border:1px solid var(--rule);border-radius:999px;background:#fff;padding:.1rem .7rem;cursor:pointer}.se-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}.se-vol{display:flex;align-items:center;gap:.3rem}.se-vol input{width:8rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="view" id="view-today">
    <header class="head"><h1>憲政院</h1><div class="sub" id="today-sub">—</div></header>
    <div id="today-alerts"></div>
    <div class="card" id="today-card"></div>
    <div class="card" id="breach-card"></div>
  </section>
  <section class="view" id="view-code" hidden>
    <header class="head"><h1>法典</h1><div class="sub" id="code-sub">—</div></header>
    <div id="code-top"></div>
    <div id="code-detail"></div>
    <div class="seg" id="code-seg"><button type="button" data-cview="all" aria-pressed="true">全文</button><button type="button" data-cview="rinen" aria-pressed="false">理念</button><button type="button" data-cview="seido" aria-pressed="false">制度と根拠</button><button type="button" data-cview="hist" aria-pressed="false">改正の歴史</button></div>
    <div class="card" id="code-list"></div>
  </section>
  <section class="view" id="view-amend" hidden>
    <header class="head"><h1>改正</h1><div class="sub">発議・冷却・審議・議決・公布</div></header>
    <div id="amend-form"></div>
    <div id="amend-list"></div>
  </section>
  <section class="view" id="view-case" hidden>
    <header class="head"><h1>判例</h1><div class="sub">迷ったら、憲法に聞く</div></header>
    <div class="card" id="case-form"></div>
    <div id="case-list"></div>
  </section>
  <section class="view" id="view-review" hidden>
    <header class="head"><h1>審査</h1><div class="sub" id="review-sub">—</div></header>
    <div id="review-body"></div>
  </section>
  <section class="view" id="view-set" hidden>
    <header class="head"><h1>設定</h1><div class="sub" id="ver"></div></header>
    <div class="card"><h2>改正の手続き<small>数字は憲法の改正条項に合わせる</small></h2><div class="grid2">
      <div class="f"><label for="s-cs">制度の冷却期間(日)</label><input id="s-cs" type="number" min="0" max="90"></div>
      <div class="f"><label for="s-cr">理念の冷却期間(日)</label><input id="s-cr" type="number" min="0" max="180"></div>
      <div class="f"><label for="s-trial">試行の日数(はじめの値)</label><input id="s-trial" type="number" min="1" max="180"></div>
      <div class="f"><label for="s-susp">一時停止の上限(日)</label><input id="s-susp" type="number" min="1" max="60"></div>
      <div class="f"><label for="s-lock">否決のあと出し直せない日数</label><input id="s-lock" type="number" min="0" max="365"></div>
      <div class="f"><label for="s-rev">審査の間隔(日)</label><input id="s-rev" type="number" min="1" max="60"></div>
    </div><div class="row"><button type="button" class="btn sm" id="save-set">保存する</button><span class="status" id="set-status"></span></div></div>
    <div class="card"><h2>接続<small>GitHub</small></h2>
      <p class="note">憲法と記録は notion-daily の roadmap/apps/kenseiin に置きます。</p>
      <div class="grid2">
        <div class="f"><label for="c-owner">ユーザー名</label><input id="c-owner" autocomplete="off"></div>
        <div class="f"><label for="c-repo">リポジトリ</label><input id="c-repo" autocomplete="off"></div>
        <div class="f"><label for="c-branch">ブランチ</label><input id="c-branch" autocomplete="off"></div>
      </div>
      <div class="f"><label for="c-token">トークン</label><input id="c-token" type="password" autocomplete="off"></div>
      <div class="row"><button type="button" class="btn sm" id="connect">接続して読み込む</button><span class="status" id="conn-status"></span></div>
      <p class="note">今開いている版:<b id="app-version"></b></p></div>
    <div class="card"><h2>効果音<small>ほかのアプリと共通</small></h2><p class="note" id="se-anchor">公布や議決のときの音を鳴らします。</p></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="today">今日</button>
  <button role="tab" aria-selected="false" data-view="code">法典</button>
  <button role="tab" aria-selected="false" data-view="amend">改正</button>
  <button role="tab" aria-selected="false" data-view="case">判例</button>
  <button role="tab" aria-selected="false" data-view="review">審査</button>
  <button role="tab" aria-selected="false" data-view="set">設定</button>
</nav>
<script id="se-core">

// ───────── 効果音(ブラウザの中で音を合成。音のファイルは使わない)─────────
// 設定(入/切・音量)は 3つのアプリで共通(localStorage の se-on / se-vol)
const SE = (() => {
  let ctx = null, master = null, lastTap = 0, lastErr = 0;
  const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  let on = ls("se-on", "1") !== "0", vol = Math.max(0, Math.min(1, +ls("se-vol", "0.5")));
  function ac(){
    if (!on) return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    master.gain.value = vol * 0.9;
    return ctx;
  }
  // 1つの音:周波数 f(滑らせるなら f2)、始まり t、長さ d、波の形、大きさ g
  function note(c, f, t, d, o){
    o = o || {};
    const osc = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    const g = o.g == null ? 0.2 : o.g, a = o.a == null ? 0.005 : o.a;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let last = gn;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; gn.connect(fl); last = fl; }
    osc.connect(gn); last.connect(master); osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  // 鐘のような音(基音 + 倍音)
  const bell = (c, f, t, d, g) => { note(c, f, t, d, { g: g }); note(c, f * 2, t, d * 0.6, { g: g * 0.35 }); note(c, f * 3.01, t, d * 0.3, { g: g * 0.12 }); };
  // ざわめき(風・波)
  function noise(c, t, d, o){
    o = o || {};
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    src.buffer = buf; fl.type = o.type || "lowpass"; fl.Q.value = o.q || 0.7;
    fl.frequency.setValueAtTime(o.f || 400, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d * 0.8);
    const g = o.g || 0.08;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + d * 0.35); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t0); src.stop(t0 + d + 0.05);
  }
  const lib = {
    tap: c => note(c, 880, 0, 0.05, { f2: 660, g: 0.05 }),
    tab: c => { note(c, 520, 0, 0.07, { type: "triangle", g: 0.07 }); note(c, 780, 0.03, 0.06, { type: "triangle", g: 0.04 }); },
    toggleOn: c => note(c, 600, 0, 0.08, { f2: 1150, g: 0.08 }),
    toggleOff: c => note(c, 900, 0, 0.08, { f2: 480, g: 0.06 }),
    done: c => { bell(c, 1046.5, 0, 0.45, 0.11); bell(c, 1318.5, 0.08, 0.6, 0.11); },
    save: c => { bell(c, 784, 0, 0.35, 0.08); bell(c, 1174.7, 0.01, 0.4, 0.06); },
    remove: c => note(c, 520, 0, 0.14, { f2: 240, type: "triangle", g: 0.08 }),
    error: c => { note(c, 220, 0, 0.09, { type: "square", g: 0.05, lp: 900 }); note(c, 196, 0.12, 0.12, { type: "square", g: 0.05, lp: 900 }); },
    open: c => noise(c, 0, 0.18, { f: 300, f2: 2400, type: "bandpass", q: 1.2, g: 0.05 }),
    fanfare: c => { [523.25, 659.25, 783.99].forEach((f, i) => { note(c, f, i * 0.09, 0.3, { type: "triangle", g: 0.12 }); note(c, f * 2, i * 0.09, 0.2, { g: 0.03 }); });
      bell(c, 1046.5, 0.27, 1.1, 0.13); note(c, 523.25, 0.27, 1.0, { type: "triangle", g: 0.06 });
      [2093, 2637, 3136, 2637].forEach((f, i) => note(c, f, 0.45 + i * 0.07, 0.25, { g: 0.025 })); },
    levelup: c => { note(c, 600, 0, 0.5, { f2: 1600, type: "triangle", g: 0.08 }); [1568, 1975.5, 2349.3, 3136].forEach((f, i) => bell(c, f, 0.35 + i * 0.06, 0.4, 0.04)); },
    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },
    swell: c => { noise(c, 0, 0.9, { f: 200, f2: 1400, g: 0.05 }); [440, 554.4, 659.3].forEach(f => note(c, f, 0.05, 0.9, { g: 0.035, a: 0.35 })); },
    unswell: c => { noise(c, 0, 0.6, { f: 1200, f2: 250, g: 0.04 }); note(c, 554.4, 0, 0.5, { f2: 440, g: 0.04, a: 0.1 }); },
    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },
    lock: c => { note(c, 180, 0, 0.06, { type: "square", g: 0.05, lp: 1200 }); note(c, 120, 0.05, 0.08, { type: "square", g: 0.05, lp: 900 }); },
    unlock: c => { note(c, 160, 0, 0.05, { type: "square", g: 0.05, lp: 1200 }); bell(c, 1318.5, 0.08, 0.45, 0.07); },
    send: c => noise(c, 0, 0.25, { f: 2400, f2: 400, type: "bandpass", q: 1.5, g: 0.06 }),
    down: c => { note(c, 660, 0, 0.25, { f2: 440, type: "triangle", g: 0.07 }); },
  };
  function play(name, opt){
    try {
      const c = ac(); if (!c || !lib[name]) return;
      if (name === "tap" || name === "tab") { const now = Date.now(); if (now - lastTap < 45) return; lastTap = now; }
      if (name === "error") { const now = Date.now(); if (now - lastErr < 500) return; lastErr = now; }
      lib[name](c, opt);
    } catch (e) {}
  }
  // 場面の見分け:アプリごとの [選び方, 音] の並び(上から順に見る)
  let rules = [];
  function soundFor(el){
    for (const [sel, snd] of rules) { const hit = el.closest(sel); if (hit) return typeof snd === "function" ? snd(hit) : snd; }
    const inp = el.closest("input");
    if (inp && (inp.type === "checkbox" || inp.type === "radio")) return inp.checked ? "toggleOn" : "toggleOff";
    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";
    if (el.closest("button, a[href], summary, .chip-b, [data-v]")) return "tap";
    return null;
  }
  function init(appRules){
    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;

<script>
(function(){

/* ───────── 取り込み:貼り付けた本文を条文に分ける ─────────
   「第N章」は章、「第N条」(漢数字でもいい)で条を区切る。条が見つからなければ、空行で区切る */
function kanjiNum(s){
  s = String(s).trim(); if (/^\d+$/.test(s)) return +s;
  const d = { 〇: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 }, u = { 十: 10, 百: 100 };

  for (const c of s.replace(/[０-９]/g, x => String.fromCharCode(x.charCodeAt(0) - 0xFEE0))) {
    if (/\d/.test(c)) { cur = cur * 10 + +c; continue; }
    if (c in d) cur = d[c]; else if (c in u) { n += (cur || 1) * u[c]; cur = 0; }
  }

}
function parseConstitution(text){
  const lines = String(text || "").replace(/\r/g, "").split("\n"), out = [];
  let chapter = "", cur = null, pre = [];
  const ART = /^\s*第\s*([0-9０-９〇一二三四五六七八九十百]+)\s*条\s*(?:[（(]([^）)]*)[）)])?\s*(.*)$/, CH = /^\s*(第\s*[0-9０-９〇一二三四五六七八九十百]+\s*章.*)$/;
  for (const ln of lines) {

    if ((m = ART.exec(ln))) { if (cur) out.push(cur); cur = { no: kanjiNum(m[1]), chapter, title: (m[2] || "").trim(), text: (m[3] || "").trim() }; continue; }
    if (cur) cur.text += (cur.text ? "\n" : "") + ln.trim(); else if (ln.trim()) pre.push(ln.trim());
  }
  if (cur) out.push(cur);

  if (!out.length) return String(text || "").split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).map((t, i) => ({ no: i + 1, chapter: "", title: "", text: t }));
  if (pre.length) out.unshift({ no: 0, chapter: "", title: "前文", text: pre.join("\n") });
  return out;
}

/* ───────── 条文 ───────── */
const live = data => data.articles.filter(a => !a.deleted).sort((a, b) => a.no - b.no);

const isSuspended = (a, today) => !!(a && a.suspended && today >= a.suspended.from && today <= a.suspended.until);

/* ───────── 改正の手続き ───────── */
const TYPES = { edit: "文を改める", add: "条を足す", del: "条を削る", kind: "理念/制度を変える", basis: "根拠を変える" };
const QUESTIONS = {
  seido: ["根拠の理念に、今より役立つか(どの理念に、どう役立つか)", "守れたかどうかを判定できる形になっているか(いつ・何を・どこまで)", "ほかの条文とぶつからないか", "体制のどこ(どの省・アプリ・タスク)に影響するか"],
  rinen: ["今の理念を、いちばん強く擁護する文を書く", "変える理由は、その擁護に勝っているか", "根っこの出来事への見方が、本当に変わったのか", "一時の気分(焦り・疲れ・落ち込み)で変えようとしていないか", "この理念を根拠にしている制度は、どう変わるか"]

// 理念にかかわる改正は重い手続き(冷却が長く、議決は別の日に2回)
function ruleOf(data, p){
  const a = p.target ? byId(data, p.target) : null;

// 発議できるか(できなければ理由を返す)
function proposeBlock(data, p, today){
  const a = p.target ? byId(data, p.target) : null;
  if (data.phase !== "enacted") return "まだ制定前です。草案のうちは、法典で直接直せます。";
  if (p.type !== "add" && !a) return "改める条文を選んでください。";
  if (a && a.root) return "根本の理念は改正できません。";

}

  const rule = ruleOf(data, p);

}
// 中身を直したら、冷却はやり直し
function editProposal(data, p, patch, today){ Object.assign(p, patch); p.rule = ruleOf(data, p); p.coolUntil = addDays(today, coolOf(data, p.rule)); p.status = "cooling"; p.votes = []; }

  if (["passed", "rejected", "withdrawn"].includes(p.status)) return p.status;

  const qs = QUESTIONS[p.rule], done = qs.every((q, i) => String((p.answers || {})[i] || "").trim());

}
// 議決。制度は1回で可決、理念は別の日に2回
function vote(data, p, yes, today){

}
// 公布:新しい版にする。翌日から施行。いつ・なぜ変えたかを残す
function promulgate(data, p, today){
  data.ver = (data.ver || 0) + 1;
  const h = { ver: data.ver, date: today, effective: addDays(today, 1), propId: p.id, type: p.type, reason: p.reason || "", rule: p.rule };
  let a = p.target ? byId(data, p.target) : null;

function endTrial(data, a, keep, today){

/* ───────── 理念の深さ(7段階) ───────── */
const LEVELS = ["知っている", "言える", "説明できる", "疑いをくぐった", "使っている", "証拠がある", "自然に出る"];
function deepLevel(data, a){

/* ───────── 保存(ぶつかったら読み直して、同じ変更をかけ直す。変更は入力欄を読まない形で渡す) ───────── */
const state = { conn: null, data: clone(DEFAULTS), sha: null, open: null, cview: "all", draftEdit: null, amendOpen: false, amendDraft: null, propEdit: null };
function lsGet(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }

const b64e = s => { const b = new TextEncoder().encode(s); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };

const api = p => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo) + "/contents/" + p;

async function readData(){
  const r = await fetch(api(DATA) + "?ref=" + encodeURIComponent(state.conn.branch || "main"), { headers: hdr(), cache: "no-store" });

}
let toastT = null;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3400); }
const se = n => { try { SE.play(n); } catch (e) {} };
const kindTag = a => a.kind === "理念" ? '<span class="kind rinen">理念・信じる</span>' : a.kind === "制度" ? '<span class="kind seido">制度・守る</span>' : '<span class="kind none">未分類</span>';

/* ───────── 今日 ───────── */
function todayPick(data, today){
  const done = data.daily.find(x => x.date === today); if (done) return byId(data, done.articleId);
